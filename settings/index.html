<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tessie Settings</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>
<body>
  <h1>Tessie Settings</h1>
  <p>Configure app-wide settings for Tessie.</p>
  <label>Access Token <input id="token" type="password" /></label><br/>
  <label>Poll Interval (seconds) <input id="poll" type="number" min="15" value="60" /></label><br/>
  <label>Retry Attempts (1-3) <input id="retries" type="number" min="1" max="3" value="3" /></label><br/>
  <button id="save">Save</button>

  <script>
    function onHomeyReady(Homey) {
      Promise.all([
        Homey.get('tessie_access_token'),
        Homey.get('poll_interval_seconds'),
        Homey.get('retry_attempts')
      ]).then(([token, poll, retries]) => {
        if (token) document.getElementById('token').value = token;
        if (poll) document.getElementById('poll').value = poll;
        if (retries) document.getElementById('retries').value = retries;
      });

      document.getElementById('save').addEventListener('click', async () => {
        await Homey.set('tessie_access_token', document.getElementById('token').value.trim());
        await Homey.set('poll_interval_seconds', Number(document.getElementById('poll').value || 60));
        await Homey.set('retry_attempts', Number(document.getElementById('retries').value || 3));
        Homey.alert('Saved');
      });

      Homey.ready();
    }
  </script>
</body>
</html>
